
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip | Dream Destination</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">Dream Destination</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="packages.html">Packages</a>
            <a href="about.html">About Us</a>
            <a href="booking.html">Book Your Trip</a>
        </div>
    </nav>
</header>

<main>
    <section class="page-hero">
        <h1>Plan Your Dream Trip</h1>
        <p>Fill in your details to create a sample trip summary.</p>
    </section>

    <section class="booking-section">
        <form id="bookingForm">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="destination">Choose Destination</label>
            <select id="destination" name="destination" required>
                <option value="">Select a destination</option>
                <option value="Bali, Indonesia">Bali, Indonesia</option>
                <option value="Switzerland">Switzerland</option>
                <option value="Maldives">Maldives</option>
                <option value="Paris, France">Paris, France</option>
                <option value="Tokyo, Japan">Tokyo, Japan</option>
                <option value="South Korea">South Korea</option>
            </select>

            <label for="travelers">Number of Travelers</label>
            <input type="number" id="travelers" name="travelers"
                   min="1" max="20" value="1" required>

            <label for="departure">Departure Date</label>
            <input type="date" id="departure" name="departure" required>

            <label for="returnDate">Return Date</label>
            <input type="date" id="returnDate" name="returnDate" required>

            <label for="budget">Your Budget (₹)</label>
            <input type="number" id="budget" name="budget"
                   min="1" placeholder="Enter your budget" required>

            <label for="message">Additional Requirements</label>
            <textarea id="message" name="message"
                      placeholder="Tell us about your preferences"></textarea>

            <button type="submit" class="btn primary form-submit">
                Create My Trip Summary
            </button>

        </form>

        <div id="bookingResult" class="booking-result"></div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Dream Destination. All rights reserved.</p>
</footer>

</body>
</html>
